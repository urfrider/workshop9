services:
  llm-multiroute:
    build: ./llm-multiroute
    container_name: llm-multiroute
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_MODEL_CLASSIFY=${OLLAMA_MODEL_CLASSIFY:-gemma4:31b}
      - OLLAMA_MODEL_SENTIMENT=${OLLAMA_MODEL_SENTIMENT:-glm-5.2}
      - OLLAMA_MODEL_SUMMARIZE=${OLLAMA_MODEL_SUMMARIZE:-gemma4:31b}
      - OLLAMA_MODEL_INTENT=${OLLAMA_MODEL_INTENT:-minimax-m3}
      - SERVER_PORT=8080
      - GUARDRAILS_BLOCK_PROMPT_INJECTION=${GUARDRAILS_BLOCK_PROMPT_INJECTION:-false}
      - GUARDRAILS_BLOCK_HARMFUL_CONTENT=${GUARDRAILS_BLOCK_HARMFUL_CONTENT:-false}
      - GUARDRAILS_BLOCK_SECRETS=${GUARDRAILS_BLOCK_SECRETS:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    networks:
      - llm-network

  llm-python:
    build: ./llm-python
    container_name: llm-python
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - APP_NAME=${APP_NAME:-llm-spring-ai}
      - SERVER_PORT=8080
    networks:
      - llm-network

  llm-frontend-python:
    build: ./llm-frontend-python
    container_name: llm-frontend-python
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://llm-multiroute:8080}
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
    depends_on:
      - llm-multiroute
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
